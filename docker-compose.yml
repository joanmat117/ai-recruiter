version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-recruiter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_recruiter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-recruiter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

# ===========================================
# QUÉ LEVANTA ESTE DOCKER-COMPOSE:
# ===========================================
# ✅ PostgreSQL 16 con extensión pgvector (puerto 5432)
# ✅ Redis 7 para BullMQ queues (puerto 6379)
#
# QUÉ NO LEVANTA (servicios externos que TÚ debes proveer):
# ===========================================
# ❌ S3 Storage (Filebase / AWS S3 / MinIO / Cloudflare R2)
#    Variables: S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY
#
# ❌ LLM Provider (OpenAI / OpenRouter / Google Gemini)
#    Variables: LLM_PROVIDER, OPENAI_API_KEY, etc.
#
# ❌ IP Whitelist file (opcional)
#    Variable: WHITELIST_FILE_PATH
#
# CONFIGURACIÓN REQUERIDA:
# ===========================================
# 1. Copia .env.example a .env:  cp .env.example .env
# 2. Edita .env con tus credenciales reales de S3 y LLM
# 3. Levanta infraestructura:     docker-compose up -d
# 4. Ejecuta migraciones:         npx drizzle-kit push
# 5. Compila y ejecuta:           npm run build && npm run start:prod